[package]
name = "bountydesk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Personal desk for ecosystem bounties, RFPs, and small paid tasks"
repository = "https://github.com/toolazytoname/bountydesk"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.14"
